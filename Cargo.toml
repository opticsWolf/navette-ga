[package]
name = "navette-ga"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "LGPL-3.0-or-later"
description = "Genetic and evolutionary thin-film synthesis on top of the navette optical engine."
repository = "https://github.com/opticsWolf/navette-ga"
readme = "README.md"
keywords = [
    "genetic-algorithm",
    "optimization",
    "thin-film",
    "optics",
    "quality-diversity",
]
categories = ["science"]

[features]
default = []
# kurobako -> rlua 0.17.1 does not compile on rustc 1.100 yet, so the proof
# harness is opt-in. `cargo test --all-features` (toolchain 1.98) covers it.
bench = ["dep:kurobako", "dep:kurobako_core", "dep:trackable"]

[dependencies]
# Optics engine: owner crate, dependency only (never copied). The path is the
# sibling Navette checkout, currently on the `dev_ga` branch, and is stripped on
# `cargo publish`; when this package is added to Navette as a member, change it
# to `../navette`.
#
# Release gate: the bridge uses navette's A1 staged needle API, A2
# `ga-introspect`, and A3 `evaluate_many`, all on `dev_ga` but not in the
# published 0.10.0. Bump this requirement once navette ships them; until then
# `cargo publish` will fail verification by design.
navette = { version = "0.10.0", path = "../Navette/rust/navette", features = [
    "opt-basin",
    "ga-introspect",
] }
# Evolutionary core (dependency in Phases 0-2; §1.1-gated copy source in Phase 3).
# `parallel` is off for deterministic seeded ledgers; navette still batches
# evaluations through its own Rayon door (A3).
genetic_algorithms = { version = "=3.0.0", default-features = false, features = ["logging"] }
# Key mutation for the custom three-key chromosome.
rand = "0.9"
# QD archive base (dependency now; fork base for F1 MOME).
symbios-genetics = "=0.2.3"
# Pareto split-off.
moors = "=0.2.11"
# The objective matrix moors' non-dominated sorting consumes. Pinned to the
# version moors already uses so the solver sees one ndarray type.
ndarray = "=0.16.1"
# Lightweight surrogate loop: GP + EGO crates directly (E00 erratum 2026-11-10:
# the umbrella `egobox` 1.0.1 crate is the PyO3 binding and does not build here).
egobox-gp = "=0.37.2"
egobox-ego = "=0.43.0"
# Study layer.
blackopt = "=0.1.0"
optimizer = "=1.0.1"
# Second pillar (pinned per E09 v2; prove before committing).
genoxide = "=0.13.1"
# Proof harness (feature `bench`).
kurobako = { version = "=0.2.10", optional = true }
kurobako_core = { version = "=0.1.12", optional = true }
trackable = { version = "=1.3.0", optional = true }

[[bin]]
name = "navette-ga"
path = "src/main.rs"
